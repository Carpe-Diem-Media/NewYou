name: Warm application dependency cache

on:
  push:
    branches: [main]
    paths:
      - 'mix.exs'
      - 'mix.lock'
      - '.tool-versions'
      - 'config/**/*.exs'
      - '.github/workflows/application-cache.yml'
      - 'tools/ci/cache_manifest.py'
      - 'tools/ci/prepare_cached_dependencies.sh'
  workflow_dispatch:

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  warm:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set Blacksmith BEAM image
        run: |
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted && "$RUNNER_NAME" == blacksmith-* ]]; then
            echo "ImageOS=ubuntu24" >> "$GITHUB_ENV"
          fi
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Identify runner image
        id: cache_platform
        run: |
          if [[ -n "${ImageVersion:-}" ]]; then
            echo "image=${RUNNER_ENVIRONMENT}-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore existing cache
        id: cache
        if: steps.cache_platform.outputs.image != ''
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            deps
            _build/test/lib
            _build/ci-dependency-cache.json
          key: app-deps-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache_platform.outputs.image }}-test-${{ hashFiles('.tool-versions', 'mix.lock', 'mix.exs', 'config/**/*.exs', 'tools/ci/cache_manifest.py', 'tools/ci/prepare_cached_dependencies.sh') }}
      - name: Prepare locked dependencies
        env:
          CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: bash tools/ci/prepare_cached_dependencies.sh
      - name: Reject unused dependency locks
        run: mix deps.unlock --check-unused
      - name: Create cache integrity manifest
        if: steps.cache_platform.outputs.image != ''
        run: python3 tools/ci/cache_manifest.py write
      - name: Save trusted dependency cache
        if: steps.cache_platform.outputs.image != '' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps
            _build/test/lib
            _build/ci-dependency-cache.json
          key: app-deps-v4-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache_platform.outputs.image }}-test-${{ hashFiles('.tool-versions', 'mix.lock', 'mix.exs', 'config/**/*.exs', 'tools/ci/cache_manifest.py', 'tools/ci/prepare_cached_dependencies.sh') }}
