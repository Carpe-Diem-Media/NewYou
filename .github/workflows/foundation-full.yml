name: Foundation Full

# Historical/provenance governance certification. This workflow is physically
# separate from the required merge gate and intentionally keeps using the
# frozen pre-migration CURRENT_AUTHORITY_MANIFEST_v1.0.0.json baseline.
#
# Nightly hardening is the only caller and runs this against the scheduled
# main SHA. It is not a PR or manual-dispatch lane.
# Current delivery-state routing belongs to Plane and Foundation Smoke's lean
# CURRENT_GOVERNANCE_ROUTER.json and CURRENT_DELIVERY_ROUTER.json instead.
#
# Every invocation starts cold, without dependency or build caches.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  foundation-full:
    name: Foundation Full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run full historical governance and provenance unit tests
        run: python tools/run_foundation_full_tests.py
      - name: Run frozen manifest-backed historical foundation audit
        run: python tools/foundation_integrity_audit.py --manifest docs/history/CURRENT_AUTHORITY_MANIFEST_v1.0.0.json --json
