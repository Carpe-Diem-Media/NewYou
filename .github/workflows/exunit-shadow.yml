name: WELL-103 ExUnit shadow benchmark

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  benchmark:
    # Only the ticket branch in this repository may spend benchmark capacity.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'well/well-103-ci-performance-investigation'
    name: shadow-${{ matrix.seed }}-${{ matrix.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        seed: [852013, 211963]
        mode: [control, shard-1, shard-2]
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Prepare cold locked dependencies
        run: bash tools/ci/prepare_cached_dependencies.sh
      - name: Reject unused dependency locks
        run: mix deps.unlock --check-unused
      - name: Provision isolated TEST role and database
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          echo "TEST_DATABASE_PASSWORD=${password}" >> "$GITHUB_ENV"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55433 -U postgres -d postgres <<SQL
          CREATE ROLE new_you_test LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD '${password}';
          CREATE DATABASE new_you_test OWNER new_you_test;
          SQL
      - name: Build browser assets
        run: mix assets.build
      - name: Run benchmark
        env:
          DESIGN_SYSTEM_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TEST_DATABASE_HOST: "127.0.0.1"
          TEST_DATABASE_PORT: "55433"
          TEST_DATABASE_USERNAME: new_you_test
          TEST_DATABASE_NAME: new_you_test
          BENCHMARK_SEED: ${{ matrix.seed }}
          BENCHMARK_MODE: ${{ matrix.mode }}
        run: python3 -m tools.exunit_shadow run "$BENCHMARK_SEED" "$BENCHMARK_MODE" "$RUNNER_TEMP/exunit-shadow"
      - name: Preserve benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-${{ matrix.seed }}-${{ matrix.mode }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exunit-shadow/
          if-no-files-found: error
          retention-days: 14

  report:
    if: always() && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'well/well-103-ci-performance-investigation'
    name: Verify shadow benchmark
    needs: benchmark
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download same-attempt measurements
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: shadow-*-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exunit-shadow
      - name: Verify identities and report timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/shadow-jobs.json"
          unset GH_TOKEN
          python3 -m tools.exunit_shadow report "$RUNNER_TEMP/exunit-shadow" "$RUNNER_TEMP/shadow-jobs.json" \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/shadow-report.json"
      - name: Preserve verified report
        uses: actions/upload-artifact@v4
        with:
          name: shadow-report-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shadow-report.json
          if-no-files-found: error
          retention-days: 14
