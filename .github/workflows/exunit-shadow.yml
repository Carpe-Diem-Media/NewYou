name: WELL-202 ExUnit shadow

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: well-202-shadow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  TEST_DATABASE_HOST: 127.0.0.1
  TEST_DATABASE_PORT: "55433"
  TEST_DATABASE_USERNAME: new_you_test
  TEST_DATABASE_NAME: new_you_test
  DESIGN_SYSTEM_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  SHADOW_PR_HEAD: ${{ github.event.pull_request.head.sha }}
  SHADOW_PR_BASE: ${{ github.event.pull_request.base.sha }}

jobs:
  configure:
    name: shadow-configure
    if: >-
      github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["codex/well-202-shadow-pilot","codex/well-202-shadow-throughput"]'), github.head_ref) &&
      (github.event.action != 'edited' || github.event.changes.body)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      seed: ${{ steps.options.outputs.seed }}
      cache: ${{ steps.options.outputs.cache }}
      topology: ${{ steps.options.outputs.topology }}
      runner: ${{ (steps.options.outputs.provider == 'configured' && vars.CI_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with: &candidate_checkout
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Select bounded experiment
        id: options
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tools/exunit_shadow.py options >> "$GITHUB_OUTPUT"

  control:
    name: shadow-control
    needs: configure
    runs-on: ${{ needs.configure.outputs.runner }}
    env:
      P815_BLACKSMITH_RUNNER: ${{ needs.configure.outputs.runner == 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    services: &isolated_services
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with: *candidate_checkout
      - uses: ./.github/actions/exunit-shadow-setup
        id: setup
        with:
          postgres: ${{ job.services.postgres.id }}
          cache: ${{ needs.configure.outputs.cache }}
      - name: Run canonical control
        env:
          SEED: ${{ needs.configure.outputs.seed }}
          CACHE_MODE: ${{ needs.configure.outputs.cache }}
        run: python3 tools/exunit_shadow.py run shadow-control "$SEED" "$CACHE_MODE" shadow-evidence
      - name: Discover expected test identities
        if: "!cancelled() && steps.setup.outcome == 'success'"
        env:
          SEED: ${{ needs.configure.outputs.seed }}
        run: python3 tools/exunit_shadow.py inventory shadow-evidence "$SEED"
      - name: Allocate complete test files
        id: plan
        env:
          SEED: ${{ needs.configure.outputs.seed }}
          TOPOLOGY: ${{ needs.configure.outputs.topology }}
        run: |
          set -euo pipefail
          matrix="$(python3 tools/exunit_shadow.py plan shadow-evidence "$SEED" "$TOPOLOGY")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Preserve control evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-control-attempt-${{ github.run_attempt }}
          path: shadow-evidence/
          if-no-files-found: warn
          retention-days: 14

  shards:
    name: ${{ matrix.name }}
    needs: [configure, control]
    runs-on: ${{ needs.configure.outputs.runner }}
    env:
      P815_BLACKSMITH_RUNNER: ${{ needs.configure.outputs.runner == 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.control.outputs.matrix) }}
    services: *isolated_services
    steps:
      - uses: actions/checkout@v7
        with: *candidate_checkout
      - uses: ./.github/actions/exunit-shadow-setup
        with:
          postgres: ${{ job.services.postgres.id }}
          cache: ${{ needs.configure.outputs.cache }}
      - name: Run complete assigned files
        env:
          SHARD: ${{ matrix.name }}
          FILES: ${{ toJSON(matrix.files) }}
          SEED: ${{ needs.configure.outputs.seed }}
          CACHE_MODE: ${{ needs.configure.outputs.cache }}
        run: python3 tools/exunit_shadow.py run "$SHARD" "$SEED" "$CACHE_MODE" shadow-evidence --files "$FILES"
      - name: Preserve shard evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: shadow-evidence/
          if-no-files-found: warn
          retention-days: 14

  verify:
    name: shadow-verify
    if: always() && needs.configure.result != 'skipped'
    needs: [configure, control, shards]
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require completed control and shard matrix
        env:
          CONTROL: ${{ needs.control.result }}
          SHARDS: ${{ needs.shards.result }}
        run: |
          if [[ "$CONTROL" != success || "$SHARDS" != success ]]; then
            echo "::error::Shadow incomplete: control=$CONTROL, shards=$SHARDS. Inspect original job evidence."
            exit 1
          fi
      - uses: actions/checkout@v7
        with: *candidate_checkout
      - name: Download same-attempt evidence
        uses: actions/download-artifact@v4
        with:
          pattern: shadow-*-attempt-${{ github.run_attempt }}
          path: evidence
      - name: Verify complete coverage and compare matched cohorts
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ needs.configure.outputs.seed }}
          CACHE_MODE: ${{ needs.configure.outputs.cache }}
          TOPOLOGY: ${{ needs.configure.outputs.topology }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api --paginate "$api/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" |
            jq -s '[.[].jobs[]]' > "$RUNNER_TEMP/shadow-jobs.json"
          gh api --paginate "$api/artifacts?per_page=100" |
            jq -s '[.[].artifacts[]]' > "$RUNNER_TEMP/shadow-artifacts.json"
          python3 tools/exunit_shadow.py verify evidence "$RUNNER_TEMP/shadow-jobs.json" \
            "$RUNNER_TEMP/shadow-artifacts.json" "$SEED" "$CACHE_MODE" "$TOPOLOGY" > shadow-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: shadow-report-attempt-${{ github.run_attempt }}
          path: shadow-report.json
          if-no-files-found: error
          retention-days: 14
