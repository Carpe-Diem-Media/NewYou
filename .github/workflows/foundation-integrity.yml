name: Foundation Integrity

# Required entry point (repository ruleset "Protect main" requires the check
# named "Foundation Integrity"). It owns routing and the always-on current-state
# Foundation Smoke safety net, and calls two reusable lanes:
#
#   Normal engineering PR -> Foundation Smoke + applicable Application CI
#   Governance/provenance PR -> Foundation Smoke + no location-based Application CI
#
# Foundation Smoke validates the current Governance and Delivery routers.
# Foundation Full runs only through nightly hardening. Unknown paths or ranges
# fail routing so a PR cannot silently skip CI.
#
# New PR heads cancel superseded runs so obsolete cold verification does not
# queue behind current work.

on:
  pull_request:

concurrency:
  group: foundation-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  route:
    name: Route CI lanes
    runs-on: ubuntu-latest
    outputs:
      hex_audit_changes: ${{ steps.classify.outputs.hex_audit_changes }}
      application_changes: ${{ steps.classify.outputs.application_changes }}
      deep_application_changes: ${{ steps.classify.outputs.deep_application_changes }}
    steps:
      - name: Check out change range
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python tools/foundation_integrity_routing.py --root . >> "$GITHUB_OUTPUT"

  foundation-smoke:
    name: Foundation Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run Foundation path-routing regression tests
        run: python -m unittest discover -s tests -p 'test_foundation_lane_routing.py' -v
      - name: Run dependency cache recovery tests
        run: python -m unittest discover -s tests -p 'test_ci_cache_recovery.py' -v
      - name: Run Hex security audit regression tests
        run: python -m unittest discover -s tests -p 'test_hex_security_audit.py' -v
      - name: Run Foundation Smoke tests
        run: python -m unittest discover -s tests -p 'test_foundation_smoke.py' -v
      - name: Run CI attestation regression tests
        run: python -m unittest discover -s tests -p 'test_ci_attestation.py' -v
      - name: Verify merge-gate topology
        run: python -m unittest discover -s tests -p 'test_foundation_merge_gate.py' -v
      - name: Run current authority smoke audit
        run: python -m tools.foundation_integrity_smoke --governance-router docs/governance/CURRENT_GOVERNANCE_ROUTER.json --delivery-router docs/delivery/CURRENT_DELIVERY_ROUTER.json --json

  application-ci:
    name: Application CI
    needs: route
    if: needs.route.outputs.application_changes == 'true'
    uses: ./.github/workflows/application-ci.yml
    with:
      deep_application_changes: ${{ needs.route.outputs.deep_application_changes == 'true' }}

  hex-security-audit:
    name: Hex security audit
    needs: route
    if: needs.route.outputs.hex_audit_changes == 'true'
    uses: ./.github/workflows/hex-security-audit.yml

  foundation-integrity:
    name: Foundation Integrity
    needs: [route, foundation-smoke, application-ci, hex-security-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require Smoke and routed Application CI
        env:
          ROUTE_RESULT: ${{ needs.route.result }}
          SMOKE_RESULT: ${{ needs.foundation-smoke.result }}
          APP_REQUIRED: ${{ needs.route.outputs.application_changes }}
          AUDIT_REQUIRED: ${{ needs.route.outputs.hex_audit_changes }}
          AUDIT_RESULT: ${{ needs.hex-security-audit.result }}
          APP_RESULT: ${{ needs.application-ci.result }}
        run: |
          set -euo pipefail
          APP_REQUIRED="${APP_REQUIRED:-}"
          if [[ "$ROUTE_RESULT" != "success" ]]; then
            echo "CI lane routing did not complete successfully: $ROUTE_RESULT"
            exit 1
          fi
          if [[ "$SMOKE_RESULT" != "success" ]]; then
            echo "Foundation Smoke did not pass: $SMOKE_RESULT"
            exit 1
          fi
          case "$APP_REQUIRED" in
            true)
              if [[ "$APP_RESULT" != "success" ]]; then
                echo "Application CI was required but did not pass: $APP_RESULT"
                exit 1
              fi
              ;;
            false)
              if [[ "$APP_RESULT" != "skipped" ]]; then
                echo "Application CI was not required but did not skip: $APP_RESULT"
                exit 1
              fi
              ;;
            *)
              echo "Invalid/missing Application CI routing decision: $APP_REQUIRED"
              exit 1
              ;;
          esac
          case "$AUDIT_REQUIRED" in
            true)
              if [[ "$AUDIT_RESULT" != "success" ]]; then
                echo "Hex security audit was required but did not pass: $AUDIT_RESULT"
                exit 1
              fi
              ;;
            false)
              if [[ "$AUDIT_RESULT" != "skipped" ]]; then
                echo "Hex security audit was not required but did not skip: $AUDIT_RESULT"
                exit 1
              fi
              ;;
            *)
              echo "Invalid/missing Hex security audit routing decision: $AUDIT_REQUIRED"
              exit 1
              ;;
          esac
