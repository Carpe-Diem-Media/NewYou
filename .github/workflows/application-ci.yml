name: Application CI

# Normal Elixir application verification. Called by foundation-integrity.yml only
# when the router selects application or engineering changes. It never runs the
# historical Foundation Full suite.
#
# TEST database contract: the same isolated TEST cluster shape as DevCore
# (127.0.0.1:55433, role and database `new_you_test`, NOCREATEDB, NOSUPERUSER),
# provided by an ephemeral PostgreSQL service. There is no DEV database and no
# fallback. The TEST role password is generated per run and never committed.

on:
  workflow_call:
    inputs:
      deep_application_changes:
        description: Whether the change affects application source, migrations, or dependency/toolchain inputs.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  mix-check:
    name: mix check
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Erlang and Elixir from .tool-versions
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Identify runner image
        id: cache_platform
        run: echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Restore dependency cache
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            deps
            _build/test/lib
            _build/ci-dependency-cache.json
          key: app-deps-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache_platform.outputs.image }}-test-${{ hashFiles('.tool-versions', 'mix.lock', 'mix.exs', 'config/**/*.exs', '.github/workflows/application-cache.yml', '.github/workflows/application-ci.yml', 'tools/ci/**') }}
      - name: Prepare locked dependencies
        env:
          CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: bash tools/ci/prepare_cached_dependencies.sh
      - name: Reject unused dependency locks
        run: mix deps.unlock --check-unused
      - name: Provision isolated TEST role and database
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          echo "TEST_DATABASE_PASSWORD=${password}" >> "$GITHUB_ENV"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55433 -U postgres -d postgres <<SQL
          CREATE ROLE new_you_test LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD '${password}';
          CREATE DATABASE new_you_test OWNER new_you_test;
          SQL
      - name: Run canonical fast gate
        env:
          DESIGN_SYSTEM_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TEST_DATABASE_HOST: "127.0.0.1"
          TEST_DATABASE_PORT: "55433"
          TEST_DATABASE_USERNAME: new_you_test
          TEST_DATABASE_NAME: new_you_test
        run: mix check

  mix-check-deep:
    name: mix check.deep
    if: inputs.deep_application_changes
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Set up Erlang and Elixir from .tool-versions
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - name: Identify runner image
        id: cache_platform
        run: echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
      - name: Restore dependency cache
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            deps
            _build/test/lib
            _build/ci-dependency-cache.json
          key: app-deps-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache_platform.outputs.image }}-test-${{ hashFiles('.tool-versions', 'mix.lock', 'mix.exs', 'config/**/*.exs', '.github/workflows/application-cache.yml', '.github/workflows/application-ci.yml', 'tools/ci/**') }}
      - name: Restore Dialyzer PLT cache
        uses: actions/cache@v4
        with:
          path: _build/plts
          key: dialyzer-plt-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
      - name: Prepare locked dependencies
        env:
          CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: bash tools/ci/prepare_cached_dependencies.sh
      - name: Reject unused dependency locks
        run: mix deps.unlock --check-unused
      - name: Provision isolated TEST role and database
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::${password}"
          echo "TEST_DATABASE_PASSWORD=${password}" >> "$GITHUB_ENV"
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55433 -U postgres -d postgres <<SQL
          CREATE ROLE new_you_test LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD '${password}';
          CREATE DATABASE new_you_test OWNER new_you_test;
          SQL
      - name: Run slower engineering gate
        env:
          TEST_DATABASE_HOST: "127.0.0.1"
          TEST_DATABASE_PORT: "55433"
          TEST_DATABASE_USERNAME: new_you_test
          TEST_DATABASE_NAME: new_you_test
        run: mix check.deep
