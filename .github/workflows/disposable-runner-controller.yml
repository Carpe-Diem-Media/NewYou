name: Disposable runner controller tests

on:
  pull_request:
    paths:
      - tools/disposable_runner.py
      - tests/test_disposable_runner.py
      - .github/workflows/disposable-runner-*.yml

permissions:
  contents: read

jobs:
  controller-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_disposable_runner -v
